name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, Static Analysis, Architecture & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo, pdo_sqlite, bcmath, intl, zip, gd, curl, xml
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan / PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Architecture boundaries (Deptrac)
        run: vendor/bin/deptrac analyse --no-interaction --no-progress

      - name: Tests (Pest)
        run: composer test

      - name: Upgrade suggestions (Rector, informational only)
        run: vendor/bin/rector process --dry-run --no-progress-bar --no-diffs
        continue-on-error: true
